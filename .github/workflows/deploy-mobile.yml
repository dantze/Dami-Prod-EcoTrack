name: Deploy Mobile

# THE BUTTON. Its default action bundles nothing and tests nothing: Build Mobile
# already published the update to the **staging** EAS branch on merge, and this
# republishes that same update onto **production**, which is the channel
# installed phones follow. Seconds, and byte-identical to what was tested.
#
# The two native actions are the deliberate exception. A store binary cannot be
# "already built" by a bundler - `eas build` compiles native code, takes ~20
# minutes and is followed by a store review. They are here because they are
# rare: a new native module, an SDK bump, a plugin/permission change, or an
# expo.version bump. An OTA cannot carry any of those.
#
# runtimeVersion is `appVersion`, so an OTA only reaches installs whose
# expo.version matches. Bumping it fences off old installs until they get a new
# binary - the safe default, not a bug.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to ship'
        required: true
        default: 'promote'
        type: choice
        options:
          - promote          # staging -> production, no rebuild
          - build-preview    # internal APK (compiles)
          - build-production # Play Store app bundle (compiles)

concurrency:
  group: deploy-mobile
  cancel-in-progress: false

permissions:
  contents: read

env:
  STAGING_BRANCH: staging
  PRODUCTION_BRANCH: production

jobs:
  ship:
    name: Ship
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Require an EAS token
        working-directory: .
        run: |
          if [ -z '${{ secrets.EXPO_TOKEN }}' ]; then
            echo "::error title=Not configured::EXPO_TOKEN is not set. See DEPLOYMENT.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # No bundler runs here, so EXPO_PUBLIC_* is irrelevant: the update being
      # moved was bundled by Build Mobile, against the URL that was set then.
      - name: Promote staging to production
        if: inputs.action == 'promote'
        run: |
          eas update:republish \
            --branch "${STAGING_BRANCH}" \
            --destination-branch "${PRODUCTION_BRANCH}" \
            --non-interactive

      # The native paths DO bundle, so they need the variables Build Mobile
      # checks. Same guard, because a binary shipped against localhost is worse
      # than an OTA: it needs a store release to correct.
      - name: Require a backend URL
        if: inputs.action != 'promote'
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "${EXPO_PUBLIC_API_BASE_URL// /}" ]; then
            echo "::error::EXPO_PUBLIC_API_BASE_URL is not set. A binary built without it calls http://localhost:8080/api, which on a phone is the phone — and only a store release can fix that."
            exit 1
          fi
          case "$EXPO_PUBLIC_API_BASE_URL" in
            */api|*/api/) ;;
            *) echo "::error::EXPO_PUBLIC_API_BASE_URL must end in /api."; exit 1 ;;
          esac

      - name: Build preview APK
        if: inputs.action == 'build-preview'
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_WEB_APP_URL: ${{ vars.EXPO_PUBLIC_WEB_APP_URL }}
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Build production app bundle
        if: inputs.action == 'build-production'
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_WEB_APP_URL: ${{ vars.EXPO_PUBLIC_WEB_APP_URL }}
        run: eas build --platform android --profile production --non-interactive --no-wait

      - name: Summary
        working-directory: .
        run: |
          {
            echo "### Mobile — ${{ inputs.action }}"
            echo ""
            if [ '${{ inputs.action }}' = 'promote' ]; then
              echo "The \`${STAGING_BRANCH}\` update is now on \`${PRODUCTION_BRANCH}\`. Phones pick it up on next launch."
            else
              echo "An EAS build was queued (\`--no-wait\`). Watch it at https://expo.dev."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
