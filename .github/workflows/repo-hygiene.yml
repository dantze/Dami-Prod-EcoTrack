name: Repo Hygiene

# Stage 0 of the PR gate: runs on EVERY pull request, with no `paths:` filter.
#
# That is the whole point. The per-project ci-*.yml filters mean a change
# outside all of them would otherwise get no CI at all; this is the floor under
# that. It is also the only check covering TODO.md, the docs and compose.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: repo-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge base to diff against; a shallow clone has no history.
          fetch-depth: 0

      # The wrapper is a binary that runs before any of our code does. Also
      # checked in ci-backend.yml so a backend PR fails fast; here so that a PR
      # touching ONLY the wrapper — which no path filter catches — cannot slip by.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Collect changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # A first push to a new branch reports an all-zero `before` SHA.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$(git rev-list --max-parents=0 HEAD | tail -1)" "$HEAD" > changed.txt
          else
            git diff --name-only "$BASE" "$HEAD" > changed.txt
          fi

          echo "Changed files:"
          cat changed.txt

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # Exit code is meaningful here, unlike the summary scripts — this step is
      # what fails the job.
      - name: Hygiene checks
        run: python3 .github/scripts/repo_hygiene.py --changed-files changed.txt

      # These four compare facts ACROSS projects, or code against prose, so a
      # `paths:` filter would mean a PR touching one side never checks the
      # other. `if: always()` so one failure does not hide the rest.
      - name: Cross-project invariants
        if: always()
        run: python3 .github/scripts/cross_project_invariants.py

      - name: Documentation claims
        if: always()
        run: python3 .github/scripts/doc_claims.py

      - name: Dead configuration
        if: always()
        run: python3 .github/scripts/dead_config.py

      - name: TODO.md index
        if: always()
        run: python3 .github/scripts/todo_index.py

      - name: Validate workflow YAML
        if: always()
        run: |
          for f in .github/workflows/*.yml; do
            [ -e "$f" ] || continue
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::not valid YAML"; exit 1; }
          done
          echo "All workflow files parse."

      # No ci-*.yml watches compose, so this is its only check — which justifies
      # its NO_CI_REQUIRED entry in repo_hygiene.py. `config -q` rather than a
      # YAML parse (TODO-29): it also resolves ${VAR} and validates the Compose
      # schema, catching an unknown key or a reference to something never
      # declared. Every value has a `:-` default, so one pass is the whole check
      # since TODO-93 removed .env.example.
      - name: Validate compose files
        if: always()
        run: |
          status=0
          for f in docker-compose*.yml; do
            [ -e "$f" ] || continue
            docker compose -f "$f" config -q \
              || { echo "::error file=$f::invalid compose file"; status=1; }
          done
          if [ "$status" -eq 0 ]; then
            echo "All compose files validate."
          fi
          exit "$status"
