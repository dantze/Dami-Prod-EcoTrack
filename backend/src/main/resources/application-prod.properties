spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Inherited from the base file, restated here because this is the line that
# used to say `update` against production Postgres. Flyway migrates; Hibernate
# only validates (TODO-101).
spring.jpa.hibernate.ddl-auto=validate

# DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASS come from Cloud Run (locally, from
# docker-compose.yml). DB_HOST is a PRIVATE IP, not the Cloud SQL Auth proxy:
# the proxy is a unix socket this plain JDBC URL cannot dial.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# admin.api.key / X-Admin-Key has been removed. /api/admin/** is now
# authorized by the caller's ADMIN role (see application.properties /
# SecurityConfig). This file intentionally does not set
# ecotrack.security.enforce: production inherits the base default, which is
# now "true", overridable per deployment via ECOTRACK_SECURITY_ENFORCE.


# ==================== Logging ====================
#
# JSON on stdout, because that is the only channel Cloud Run has and a
# multi-line Java stack trace arrives in Cloud Logging as N separate entries at
# the wrong severity (TODO-104). One JSON object per line is one entry.
#
# The format is OURS rather than one of the three Spring Boot ships, and
# config/GoogleCloudLogFormat.java explains why in full: Cloud Logging reads a
# top-level `severity`, ECS nests it as `log.level`, and the `rename` property
# renames a member where it sits instead of hoisting it. Every line would have
# been filed as INFO - a broken-alerting failure that looks like silence.
#
# The `requestId` that config/RequestIdFilter puts in the MDC rides along as a
# top-level field, which is what makes "show me everything that request did" a
# single query.
logging.structured.format.console=com.example.damiProd.config.GoogleCloudLogFormat
