# In-memory H2, so tests never read or write the real data/damiprod.mv.db file.
#
# This URL is a FALLBACK and should not be what any test actually runs on.
# `jdbc:h2:mem:testdb` is a NAMED database and DB_CLOSE_DELAY=-1 keeps it alive
# for the whole JVM, so it outlived every Spring context in a run and all of
# them shared it - which was TODO-31: the classes exercising the first-user
# bootstrap cannot be @Transactional, so each committed an ADMIN that the next
# class then read. Every @SpringBootTest now carries @AutoConfigureTestDatabase
# and gets its own uniquely-named database per context (@DataJpaTest applies the
# same annotation itself). SuiteTests/DatabaseIsolationTest holds that rule and
# explains it; a test that ends up on the URL below has escaped it.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# The suite builds its schema with FLYWAY, not with create-drop (TODO-101).
#
# This is the only place the migrations are actually executed in CI, and that is
# the point: `ddl-auto=validate` then holds every migration to the entities on
# every test run, so a migration that forgets a column, or an entity that grows
# one without a migration, fails here rather than at a production boot. Each
# @SpringBootTest still gets its own database (see the URL note above), so
# Flyway runs per context against an empty schema and V1 applies cleanly.
spring.jpa.hibernate.ddl-auto=validate

# No schema.sql / data.sql script initialisation.
#
# This governs schema.sql / data.sql only. It has never had anything to say
# about DataLoader, which is a @Component implementing CommandLineRunner - and
# SpringBootContextLoader runs the runners, so every @SpringBootTest context
# seeded the 4 role rows and the 11 products into its own database. Verified,
# not assumed (TODO-31); the key below is what actually turns that off.
spring.sql.init.mode=never

# DataLoader OFF for the whole suite (TODO-74).
#
# The seed was unrequested state that every @SpringBootTest context paid for,
# and it made "the products table has N rows" mean one thing here and another in
# a @DataJpaTest, which does not register the bean at all - a difference nothing
# stated and a future assertion could trip over.
#
# Nothing was depending on it, which was the open question. Every test that
# needs a role find-or-creates it (AuthorizationMatrixTest, TaskScopingTest,
# LastAdminGuardTest, AdminSessionRevocationTest, AuthEnforcementOnTest), which
# is what EnrollmentService.resolveRole does in production too, and no
# @SpringBootTest touches the product catalogue at all. Turning it off is
# therefore a removal, not a behaviour change: verified by a full green run.
#
# The seeding itself is still covered - BootstrapTests/DataLoaderTest is a
# @DataJpaTest that @Imports DataLoader and calls run() explicitly, so it is
# unaffected by this key, and SuiteTests/DatabaseIsolationTest asserts a fresh
# @SpringBootTest context is unseeded, so switching this back on fails the suite
# rather than quietly reintroducing the state.
ecotrack.bootstrap.seed-reference-data=false

# Security enforcement is ON by default under the "test" profile so that
# @SpringBootTest classes exercise the real (enforced) behaviour. Individual
# @WebMvcTest slices are NOT profiled and therefore see the base
# application.properties default (enforce=false) instead - see
# AuthEnforcementOnTest / AuthEnforcementOffTest for tests of both modes.
ecotrack.security.enforce=true
