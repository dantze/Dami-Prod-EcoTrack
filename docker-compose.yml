# =========================================================================
# The LOCAL backend environment: Postgres + the backend image.
#
# THIS IS NOT DEPLOYED ANYWHERE, and it is not how you normally run the backend
# either — `./gradlew bootRun` does that on H2, with no Docker at all. This
# exists for the one thing bootRun cannot give you: the backend against REAL
# POSTGRES. Production is Postgres, local defaults to H2, and `ddl-auto=update`
# with no migration tool means that gap can bite.
#
# It used to bring up the SPA behind Caddy too, because one `docker compose up`
# on a droplet WAS the deployment. That went with TODO-91: Caddy served the SPA
# and /api on ONE origin, and production is two (Vercel and Cloud Run), so the
# full-stack recipe modelled a shape that no longer exists. Run the SPA with
# `npm run dev` against this backend instead — DEPLOYMENT.md's "Local" section
# has that two-origin arrangement, which is what production actually looks like.
# =========================================================================
services:
  # =========================================================================
  # PostgreSQL Database Service
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecotrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-damiprod}
      POSTGRES_USER: ${DB_USER:-damiprod_user}
      POSTGRES_PASSWORD: ${DB_PASS:-secure_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose locally for management/debugging if needed
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-damiprod_user} -d ${DB_NAME:-damiprod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecotrack_network

  # =========================================================================
  # Spring Boot Backend Service
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecotrack_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-damiprod}
      DB_USER: ${DB_USER:-damiprod_user}
      DB_PASS: ${DB_PASS:-secure_db_password}
      # Photo upload needs a real GCS bucket and Application Default
      # Credentials; empty here, so the local stack runs and only uploads fail.
      GCS_BUCKET: ${GCS_BUCKET:-}
      ECOTRACK_SECURITY_ENFORCE: ${ECOTRACK_SECURITY_ENFORCE:-true}
      ECOTRACK_CORS_ALLOWED_ORIGINS: ${ECOTRACK_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Optional first-run admin code (TODO-36). Unset => the backend
      # generates one and prints it to the log.
      ECOTRACK_SETUP_CODE: ${ECOTRACK_SETUP_CODE:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ecotrack_network

volumes:
  postgres_data:
    driver: local

networks:
  ecotrack_network:
    driver: bridge
